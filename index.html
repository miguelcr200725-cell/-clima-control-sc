
<!DOCTYPE html>
<html lang="es">
<head>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0789ef">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071525">
<title>CLIMA CONTROL SC</title>
<style>
*{box-sizing:border-box}
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .then(() => console.log("CLIMA CONTROL SC listo"))
      .catch(error => console.error("Error:", error));
  });
}
</script>
body{margin:0;background:#071525;color:#eef6ff;font-family:Arial,sans-serif}
header{padding:24px 18px;background:linear-gradient(135deg,#071525,#0755a5);border-bottom:2px solid #159bff}
h1{font-size:23px;margin:0;color:#36aaff}
header p{color:#c3d5e6;margin:8px 0 0}
main{max-width:750px;margin:auto;padding:18px}
.panel{background:#10243a;border:1px solid #294663;border-radius:15px;padding:18px;margin-bottom:17px}
h2{font-size:19px;color:#9bcfff;margin-top:0}
input,textarea{width:100%;padding:13px;margin:7px 0 12px;border:1px solid #52718e;border-radius:9px;background:#071525;color:white;font-size:16px}
button{padding:13px 17px;border:0;border-radius:9px;background:#0789ef;color:white;font-weight:bold;font-size:15px;margin:4px 3px 4px 0}
button.secondary{background:#52677b}
button.danger{background:#a83242}
.small{font-size:13px;color:#a9bfd2}
.hidden{display:none}
.customer{padding:13px;border:1px solid #35516d;border-radius:10px;margin:10px 0;background:#0a1b2c}
.customer strong{color:#68baff;font-size:17px}
.customer p{margin:7px 0;color:#d2dfeb}
#status{color:#8dd1ff;font-size:14px}
</style>
</head>
<body>
<header>
<h1>❄ CLIMA CONTROL SC</h1>
<p>Gestión profesional de climatización</p>
</header>
<main>
<div id="login" class="panel">
<h2 id="formTitle">Iniciar sesión</h2>
<p class="small">Acceso privado para técnicos</p>
<div id="nameArea" class="hidden">
<label>Nombre del técnico</label>
<input id="name" placeholder="Tu nombre">
</div>
<label>Correo electrónico</label>
<input id="email" type="email" placeholder="correo@ejemplo.com">
<label>Contraseña</label>
<input id="password" type="password" placeholder="Contraseña">
<button id="enter">Iniciar sesión</button>
<button id="toggle" class="secondary">Crear cuenta</button>
<p id="status"></p>
</div>

<div id="app" class="hidden">
<div class="panel">
<h2>Panel de trabajo</h2>
<p id="welcome"></p>
<button id="logout" class="danger">Cerrar sesión</button>
</div>

<div class="panel">
<h2>Registrar nuevo cliente</h2>
<label>Nombre del cliente</label>
<input id="clientName" placeholder="Nombre completo">
<label>Teléfono</label>
<input id="phone" type="tel" placeholder="Número de teléfono">
<label>Dirección</label>
<input id="address" placeholder="Dirección del cliente">
<label>Observaciones</label>
<textarea id="notes" placeholder="Equipo, capacidad BTU, detalles..."></textarea>
<button id="save">Guardar cliente</button>
<p id="saveStatus" class="small"></p>
</div>

<div class="panel">
<h2>Mis clientes</h2>
<input id="search" placeholder="Buscar cliente...">
<div id="clients">Todavía no hay clientes registrados.</div>
</div>
</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
 getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
 onAuthStateChanged, signOut, updateProfile
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {
 getFirestore, collection, addDoc, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyC9nFbwuZ3osVMu40X-CfP4_ScYAfvj3u8",
 authDomain: "clima-control-sc-f6a1a.firebaseapp.com",
 projectId: "clima-control-sc-f6a1a",
 storageBucket: "clima-control-sc-f6a1a.firebasestorage.app",
 messagingSenderId: "672050898146",
 appId: "1:672050898146:web:e1618a8cd6a08dd1c0eabb",
 measurementId: "G-JKJR22LHSW"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);

let creating = false;
let unsubscribe = null;
let allClients = [];

const $ = id => document.getElementById(id);

$("toggle").onclick = () => {
 creating = !creating;
 $("formTitle").textContent = creating ? "Crear cuenta de técnico" : "Iniciar sesión";
 $("nameArea").classList.toggle("hidden",!creating);
 $("enter").textContent = creating ? "Crear mi cuenta" : "Iniciar sesión";
 $("toggle").textContent = creating ? "Volver al inicio de sesión" : "Crear cuenta";
 $("status").textContent = "";
};

$("enter").onclick = async () => {
 const email = $("email").value.trim();
 const password = $("password").value;
 $("status").textContent = "Procesando...";
 try {
  if(creating){
   const name = $("name").value.trim();
   if(!name) throw new Error("Escribe tu nombre.");
   const result = await createUserWithEmailAndPassword(auth,email,password);
   await updateProfile(result.user,{displayName:name});
  } else {
   await signInWithEmailAndPassword(auth,email,password);
  }
 } catch(error) {
  $("status").textContent = error.code === "auth/email-already-in-use"
   ? "Ese correo ya tiene una cuenta."
   : error.code === "auth/weak-password"
   ? "La contraseña debe tener al menos 6 caracteres."
   : error.code === "auth/invalid-credential"
   ? "Correo o contraseña incorrectos."
   : error.message;
 }
};

$("logout").onclick = () => signOut(auth);

onAuthStateChanged(auth,user => {
 $("login").classList.toggle("hidden",!!user);
 $("app").classList.toggle("hidden",!user);
 if(unsubscribe){unsubscribe();unsubscribe=null;}
 if(user){
  $("welcome").textContent = "Sesión iniciada: "+(user.displayName || user.email);
  const path = collection(db,"users",user.uid,"clientes");
  unsubscribe = onSnapshot(path,snapshot => {
   allClients = snapshot.docs.map(d=>({id:d.id,...d.data()}));
   renderClients();
  },error => {
   $("clients").textContent = "Error al cargar clientes: "+error.message;
  });
 }
});

$("save").onclick = async () => {
 const user = auth.currentUser;
 const name = $("clientName").value.trim();
 if(!user || !name){
  $("saveStatus").textContent = "Escribe al menos el nombre del cliente.";
  return;
 }
 $("save").disabled = true;
 try{
  await addDoc(collection(db,"users",user.uid,"clientes"),{
   nombre:name,
   telefono:$("phone").value.trim(),
   direccion:$("address").value.trim(),
   observaciones:$("notes").value.trim(),
   creado:serverTimestamp()
  });
  $("clientName").value="";
  $("phone").value="";
  $("address").value="";
  $("notes").value="";
  $("saveStatus").textContent="Cliente guardado correctamente.";
 }catch(error){
  $("saveStatus").textContent="No se pudo guardar: "+error.message;
 }finally{
  $("save").disabled=false;
 }
};

function renderClients(){
 const query = $("search").value.toLowerCase();
 const filtered = allClients.filter(c=>
  [c.nombre,c.telefono,c.direccion].join(" ").toLowerCase().includes(query)
 );
 $("clients").innerHTML="";
 if(!filtered.length){
  $("clients").textContent="No hay clientes para mostrar.";
  return;
 }
 filtered.forEach(c=>{
  const div=document.createElement("div");
  div.className="customer";
  const title=document.createElement("strong");
  title.textContent=c.nombre || "Sin nombre";
  const phone=document.createElement("p");
  phone.textContent="Teléfono: "+(c.telefono || "No registrado");
  const address=document.createElement("p");
  address.textContent="Dirección: "+(c.direccion || "No registrada");
  const notes=document.createElement("p");
  notes.textContent="Observaciones: "+(c.observaciones || "Ninguna");
  div.append(title,phone,address,notes);
  $("clients").append(div);
 });
}
$("search").oninput=renderClients;
</script>
</body>
</html>
